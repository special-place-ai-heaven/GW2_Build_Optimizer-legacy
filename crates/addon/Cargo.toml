[package]
name = "gw2-build-optimizer"
version.workspace = true
edition.workspace = true
authors = ["special-place-ai-heaven"]
description = "In-game Guild Wars 2 build optimizer and AI build assistant for Nexus"
license.workspace = true
repository = "https://github.com/special-place-ai-heaven/GW2_Build_Optimizer"

[lib]
crate-type = ["cdylib"]

[dependencies]
gw2-core = { path = "../core" }
# WAVE5-MEASURE allowlist: addon→gw2-api is I/O, not plated combat or flow.
# Kept for setup key validate, character/build fetch, DataCache refresh,
# and download_game_and_names. Do not drop this dependency.
gw2-api = { path = "../gw2api" }
gw2-optimizer = { path = "../optimizer" }
# "mumble": combat detection for radio ducking (gw2_mumble is already in the
# tree via the serde feature; this only ungates nexus::data_link::mumble).
nexus = { git = "https://github.com/zerthox/nexus-rs", features = ["serde", "mumble"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
chrono.workspace = true
reqwest.workspace = true
uuid.workspace = true
rodio.workspace = true
stream-download.workspace = true
icy-metadata.workspace = true
tokio.workspace = true
image.workspace = true
