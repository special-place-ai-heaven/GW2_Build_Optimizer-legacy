[workspace]
members = [
    "crates/addon",
    "crates/core",
    "crates/gw2api",
    "crates/optimizer",
]
exclude = ["server/feedback"]
resolver = "2"

[workspace.package]
version = "1.14.48"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls, NOT the platform TLS stack. On Windows the default (`default-tls`)
# resolves to schannel, and Wine's schannel -- which is what actually runs when
# the addon is loaded into GW2 under Proton/Linux -- fails the handshake with
# CERT_E_REVOCATION_FAILURE (0x800B010E) because it cannot complete a
# certificate revocation check. The user only ever sees reqwest's generic
# "error sending request for url (...)" wrapper. rustls carries its own crypto
# and its own Mozilla root set (webpki-roots), so the addon no longer depends on
# the host OS TLS stack at all. `charset`/`http2` are re-added explicitly
# because `default-features = false` also drops them.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "charset",
    "http2",
    "rustls-tls",
] }
thiserror = "2"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
# html5ever with CSS selectors. Renamed: `crate::scraper` is ours, and the
# benchmark work needs both a tree walk and targeted selection.
# `main` is scraper's own CLI demo and drags in getopts; a cdylib in a game
# process has no use for an argument parser.
html = { package = "scraper", version = "0.25", default-features = false, features = [
    "errors",
] }
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
# Radio playback stack. stream-download is pinned to 0.22.x on purpose: 0.23+
# jumps to reqwest 0.13 while the workspace is on 0.12, and 0.22.9 resolves to
# the SINGLE shared reqwest. Do NOT bump without re-checking `cargo tree -i reqwest`.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp3", "mp4"] }
# `reqwest-rustls` (not `reqwest-native-tls`) for the same reason as reqwest
# above: native-tls would drag schannel back in and re-break the radio stream
# under Proton. It selects the SAME reqwest build (0.22.9 -> reqwest 0.12).
stream-download = { version = "0.22.9", default-features = false, features = ["reqwest-rustls"] }
icy-metadata = { version = "0.6", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# News still processing (crates/addon/src/news_art.rs): decode -> downscale ->
# re-encode, so the Nexus texture loader is always handed an already-correctly-
# sized file. `default-features = false` is LOAD-BEARING, not tidiness: the
# default set is ["rayon", "default-formats"], which would install a global
# rayon work-stealing thread pool inside a DLL injected into the running game
# and compile a dozen decoders we never feed (avif, exr, tiff, webp, gif, qoi).
# `sniff()` only ever admits JPEG and PNG magic, so every other parser would be
# dead attack surface. Each of "jpeg"/"png" gives BOTH the decoder and encoder.
# Nothing in this subtree touches reqwest/tokio/rodio, so the stream-download
# pin above is unaffected -- re-check `cargo tree -i reqwest` if you bump it.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
